name: Build EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ps2exe
        shell: pwsh
        run: Install-Module -Name ps2exe -Force -Scope CurrentUser

      - name: Compile PS1 to EXE
        shell: pwsh
        run: |
          Invoke-ps2exe -inputFile "Battery_Health_Zenbook.ps1" `
                         -outputFile "BatteryHealth.exe" `
                         -noConsole `
                         -title "Battery Health" `
                         -description "Salute batteria - ASUS Zenbook"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryHealth-exe
          path: BatteryHealth.exe

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BatteryHealth.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
